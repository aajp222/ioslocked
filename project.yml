name: Locked
options:
  bundleIdPrefix: com.aaryanpanchal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2MUHC6TNGW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"

schemes:
  Locked:
    build:
      targets:
        Locked: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LockedTests

targets:
  # ─────────────────────────────────────────────────────────── the app
  Locked:
    type: application
    platform: iOS
    sources:
      - path: Locked
      - path: Shared
      # The Orbit seam. Deliberately not in Shared/ — that directory is
      # compiled into all three extensions, and the shield has no business
      # holding a task list. The app alone talks to Orbit.
      - path: "../../../Locked X Orbit/Bridge/OrbitBridge.swift"
    dependencies:
      - target: LockedWidgets
      - target: LockedMonitor
      - target: LockedShield
      - sdk: ActivityKit.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
    info:
      path: Locked/Info.plist
      properties:
        CFBundleDisplayName: Locked
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserNotificationsUsageDescription: "Locked notifies you when a session ends and when your pod answers an unlock request."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Lets the app reach a pod server on localhost or the local network over
        # plain HTTP. Does not weaken anything for real hosts — put those behind
        # HTTPS and ATS applies as normal.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Separate from ATS: since iOS 14, talking to a device on the local
        # network needs privacy permission. Without this key iOS refuses the
        # connection outright and reports it as "the internet appears offline",
        # which is how a Mac on the same Wi-Fi looks unreachable.
        NSLocalNetworkUsageDescription: "Locked connects to your pod's server on this network so your sessions, unlock requests and verdicts reach the rest of your pod."
        # HTTPS only, which is exempt — this stops App Store Connect asking
        # about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
        # locked:// — invite links, and the Orbit hand-off. Registered here
        # rather than in Info.plist because XcodeGen generates that file and
        # would discard the edit on the next run.
        CFBundleURLTypes:
          - CFBundleURLName: com.aaryanpanchal.locked
            CFBundleURLSchemes: [locked]

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaryanpanchal.locked
        PRODUCT_NAME: Locked
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Locked/Locked.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Locked/Locked-Distribution.entitlements

  # ─────────────────────────────────────────────────────── unit tests
  LockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LockedTests
    dependencies:
      - target: Locked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaryanpanchal.locked.tests
        GENERATE_INFOPLIST_FILE: YES

  # ──────────────────────────────────── Live Activity / Dynamic Island
  LockedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LockedWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaryanpanchal.locked.widgets
        PRODUCT_NAME: LockedWidgets
        INFOPLIST_FILE: LockedWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LockedWidgets/LockedWidgets.entitlements
        SKIP_INSTALL: YES

  # ───────────────────── re-arms the shield when the app isn't running
  LockedMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: LockedMonitor
      - path: Shared
        excludes:
          - LockedActivity.swift
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaryanpanchal.locked.monitor
        PRODUCT_NAME: LockedMonitor
        INFOPLIST_FILE: LockedMonitor/Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: LockedMonitor/LockedMonitor.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: LockedMonitor/LockedMonitor-Distribution.entitlements

  # ──────────────────────── the screen you hit when you open Instagram
  LockedShield:
    type: app-extension
    platform: iOS
    sources:
      - path: LockedShield
      - path: Shared
        excludes:
          - LockedActivity.swift
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaryanpanchal.locked.shield
        PRODUCT_NAME: LockedShield
        INFOPLIST_FILE: LockedShield/Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: LockedShield/LockedShield.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: LockedShield/LockedShield-Distribution.entitlements
